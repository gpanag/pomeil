<mat-card class="auth-card">
  <div class="auth-header">
    <mat-icon>lock</mat-icon>
    <h2>{{ 'AUTH.CHANGE_PASSWORD' | translate }}</h2>
  </div>

  <mat-card-content>
    <div *ngIf="error" class="error-message">{{ error }}</div>
    <div *ngIf="success" class="success-message">{{ success | translate }}</div>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.CURRENT_PASSWORD' | translate }}</mat-label>
      <input matInput [(ngModel)]="currentPassword" [type]="hideCurrentPassword ? 'password' : 'text'" autocomplete="current-password">
      <mat-icon matPrefix>vpn_key</mat-icon>
      <button mat-icon-button matSuffix (click)="hideCurrentPassword = !hideCurrentPassword" type="button">
        <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.NEW_PASSWORD' | translate }}</mat-label>
      <input matInput [(ngModel)]="newPassword" [type]="hideNewPassword ? 'password' : 'text'" autocomplete="new-password">
      <mat-icon matPrefix>vpn_key</mat-icon>
      <button mat-icon-button matSuffix (click)="hideNewPassword = !hideNewPassword" type="button">
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-hint *ngIf="newPassword && newPassword.length < 6">Minimum 6 characters</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</mat-label>
      <input matInput [(ngModel)]="confirmPassword" type="password" autocomplete="new-password">
      <mat-icon matPrefix>vpn_key</mat-icon>
      <mat-error *ngIf="confirmPassword && !passwordsMatch">{{ 'AUTH.PASSWORDS_MISMATCH' | translate }}</mat-error>
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading || !formValid">
      <mat-icon *ngIf="!loading">save</mat-icon>
      <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
      {{ 'AUTH.SAVE' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
