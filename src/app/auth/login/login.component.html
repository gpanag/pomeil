<mat-card class="auth-card">
  <div class="auth-header">
    <mat-icon>lock_open</mat-icon>
    <h2>{{ 'AUTH.LOGIN' | translate }}</h2>
  </div>

  <mat-card-content>
    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.IDENTIFIER' | translate }}</mat-label>
      <input matInput [(ngModel)]="identifier" (keydown.enter)="login()" autocomplete="username">
      <mat-icon matPrefix>email</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.PASSWORD' | translate }}</mat-label>
      <input matInput [(ngModel)]="password" [type]="hidePassword ? 'password' : 'text'" (keydown.enter)="login()" autocomplete="current-password">
      <mat-icon matPrefix>vpn_key</mat-icon>
      <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="login()" [disabled]="loading || !identifier || !password">
      @if (!loading) {
        <mat-icon>login</mat-icon>
      }
      @if (loading) {
        <mat-spinner diameter="20"></mat-spinner>
      }
      {{ 'AUTH.LOGIN_BUTTON' | translate }}
    </button>
  </mat-card-actions>

  <div class="auth-links">
    <a routerLink="/forgot-password">{{ 'AUTH.FORGOT_PASSWORD' | translate }}</a>
    <br>
      <span>{{ 'AUTH.NO_ACCOUNT' | translate }} </span>
      <a routerLink="/register">{{ 'AUTH.REGISTER' | translate }}</a>
    </div>
  </mat-card>
