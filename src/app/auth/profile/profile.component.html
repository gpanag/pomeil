<mat-card class="auth-card">
  <div class="auth-header">
    <mat-icon>person</mat-icon>
    <h2>{{ 'AUTH.MY_PROFILE' | translate }}</h2>
  </div>

  <mat-card-content>
    @if (error) {
      <div class="error-message">{{ error }}</div>
    }
    @if (success) {
      <div class="success-message">{{ success | translate }}</div>
    }

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.EMAIL' | translate }}</mat-label>
      <input matInput [value]="email" disabled>
      <mat-icon matPrefix>email</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>{{ 'AUTH.USERNAME' | translate }}</mat-label>
      <input matInput [(ngModel)]="username" autocomplete="name">
      <mat-icon matPrefix>person</mat-icon>
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="loading">
      @if (!loading) {
        <mat-icon>save</mat-icon>
      }
      @if (loading) {
        <mat-spinner diameter="20"></mat-spinner>
      }
      {{ 'AUTH.SAVE' | translate }}
    </button>

    <button mat-stroked-button routerLink="/account/change-password">
      <mat-icon>lock</mat-icon>
      {{ 'AUTH.CHANGE_PASSWORD' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
