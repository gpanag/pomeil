<div class="mat-typography mat-app-background main-app">

  <!--
    Floating language picker for escape rooms. Lives outside the toolbars
    on purpose: the body.escape-room-fullscreen rule hides every toolbar
    for immersion, but players still need to switch language inside a
    room. This element is shown only when (a) the active route is an
    individual room and (b) the player is in fullscreen — see the
    .er-floating-lang rule in styles.scss. In windowed mode the regular
    toolbar picker handles language switching, so we'd otherwise be
    rendering a duplicate.
  -->
  <div *ngIf="isInEscapeRoom" class="er-floating-lang">
    <app-translate></app-translate>
  </div>

  <mat-toolbar>

    <div class="logo">

      <a routerLink="/">
        <img [src]="'assets/logos/Project_Logo.png'" width="auto" />
      </a>

    </div>
    <div routerLink="/" style="cursor: pointer;">
      <span>
        POMEIL
      </span>
    </div>
    <div class="spacer"></div>
    <app-socials-menu></app-socials-menu>
    <!-- <div class="contact" matTooltip="Contact Us">
      <a mat-icon-button href="mailto:pomeil.eu@gmail.com">
        <mat-icon>mail</mat-icon>
    </a>
    </div> -->
    <div class="menu-whole" *ngIf="innerWidth > 1400? true :false">
      <button class="menu-button" mat-flat-button routerLink="home"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']" [routerLinkActiveOptions]="{exact: true}">
        <mat-icon>home</mat-icon>{{"NAVIGATION.HOME" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="learning"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>school</mat-icon>{{"NAVIGATION.LEARNING" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="about"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>info</mat-icon>{{"NAVIGATION.ABOUT" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="partnership"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>handshake</mat-icon>{{"NAVIGATION.PARTNERSHIP" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="outputs"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>inventory_2</mat-icon>{{"NAVIGATION.OUTPUTS" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="resources"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>library_books</mat-icon>{{"NAVIGATION.RESOURCES" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="articles"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>article</mat-icon>{{"NAVIGATION.ARTICLES" | translate}}
      </button>
      <button class="menu-button" mat-flat-button routerLink="leaflets"
        [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']">
        <mat-icon>description</mat-icon>{{"NAVIGATION.LEAFLETS" | translate}}
      </button>
    </div>
    <button mat-icon-button [matMenuTriggerFor]="menuParent" *ngIf="innerWidth <= 1400? true :false">
      <mat-icon>menu</mat-icon>
      <mat-menu #menuParent="matMenu">
        <button class="menu-button" mat-menu-item routerLink="home"
          [routerLinkActive]="isDarkTheme? ['is-active-dark'] : ['is-active']" [routerLinkActiveOptions]="{exact: true}"
          #home="routerLinkActive">
          <mat-icon>home</mat-icon>{{"NAVIGATION.HOME" | translate}}
        </button>
        <button class="menu-button" mat-menu-item routerLink="learning"

          <mat-icon>description</mat-icon>{{"NAVIGATION.LEAFLETS" | translate}}
        </button>
      </mat-menu>
    </button>

    <app-account-menu></app-account-menu>
    <app-translate></app-translate>

  </mat-toolbar>
