<div class="page-parent mat-app-background">
    <div class="list">
        <div class="title">
            <h5 class="title">{{"NAVIGATION.PARTNERSHIP" | translate}}</h5>
        </div>

        <div class="front-partners-parent">
            <div class="list-content">
                <div class="grid-list" *ngIf="partners.length > 0  && listGrid === false" fxLayout="row wrap"
                    fxLayoutGap="16px grid" fxFlex="auto" [@listAnimation]="suffleCards">

                    <div fxFlex *ngFor="let partner of partners" class="front-partner-card">
                        <div>
                            <div>
                                <div class="front-patern-image"
                                    [style.background-image]=" partner?.logo ? 'url(' + partner?.logo.url +')' :
                                ( darkTheme ? 'url(assets/logos/no_image.jpg)' : 'url(assets/logos/no_image.jpg)')"
                                    (click)="openPartner(partner.documentId)"></div>
                                <div class="front-partner-title is-link"
                                    (click)="openPartner(partner.documentId)">
                                    <span>
                                        {{partner?.name}}
                                    </span>
                                </div>

                             
                            </div>
                        
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
