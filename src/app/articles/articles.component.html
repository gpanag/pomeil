<div class="news-parent mat-app-background">
  <div class="list">
    <div class="title">
      <h5 class="title">{{"NAVIGATION.ARTICLES" | translate}}</h5>
    </div>

    <div class="results-parent">
      <div class="list-content">
        <!-- Card grid: these static styles are what @angular/flex-layout used to write inline
        (row wrap, 16px grid gap, flexible cards); the library was removed 2026-10-26. -->
        @if (news.length > 0  && listGrid === false) {
          <div class="grid-list"
            style="flex-flow: row wrap; box-sizing: border-box; display: flex; flex: 1 1 auto; margin: 0 -16px -16px 0;" [@listAnimation]="suffleCards">
            @for (newItem of news; track newItem) {
              <div style="flex: 1 1 0%; box-sizing: border-box; padding: 0 16px 16px 0;" class="item-card">
                <mat-card class="mat-elevation-z4 example-card">
                  <mat-card-header style="max-width: 100%">
                    <mat-card-title class="item-title is-link" style="font-size: 16px;"
                      (click)="openNew(newItem)">
                      <span>
                        {{ articleTitle(newItem) }}
                      </span>
                    </mat-card-title>
                    <!-- <mat-card-subtitle >{{newItem?.publishedAt | date:undefined: undefined: lang === 'ee' ? 'ee' : lang
                    === 'gr' ? 'gr' : lang === 'no' ? 'no' : lang === 'pl' ? 'pl' : lang === 'ua' ? 'ua' : 'en'
                  }}</mat-card-subtitle> -->
                </mat-card-header>
                @if (newItem.image) {
                  <div class="list-thumb-container">
                    @if (newItem.image) {
                      <div class="list-thumb" mat-card-image
                        (click)="openNew(newItem)"
                        [style.backgroundImage]="'url(' + newItem.image.url + ')'"
                        loading="lazy">
                      </div>
                    }
                    @if (!newItem.image) {
                      <div class="list-thumb-no-image" mat-card-image
                        (click)="openNew(newItem)"
                        [style.backgroundImage]="'url(assets/images/no_image.jpg)'" loading="lazy">
                      </div>
                    }
                  </div>
                }
                <mat-card-content>
                  <!-- <div class="news-front-content"
                  [innerHTML]="lang === 'en'? newItem?.attributes.content_en : newItem?.attributes.content_el  | safeHtml">
                </div> -->
              </mat-card-content>
              <mat-card-actions>
                <button mat-button (click)="openNew(newItem)">{{"TOOLS.MORE" | translate}}</button>
                <div class="spacer"></div>
              </mat-card-actions>
            </mat-card>
          </div>
        }
      </div>
    }
  </div>
</div>
<div class="paginator-parent">
  <mat-paginator class="paginator" [length]="newsCount" [pageSize]="pageSize" [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page" (page)="onPaginateChange($event)">
  </mat-paginator>
</div>
</div>
</div>
<app-footer></app-footer>
